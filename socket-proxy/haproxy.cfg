# Docker 소켓 프록시 (공용 스택 socket-proxy) — PRD 5.2 허용목록 액션 어댑터 · 5.4
#
# healing 만 부른다 (moa-core 전용 내부 네트워크 ctl). Docker API 중 아래만 통과시키고 나머지는 403:
#   GET  /_ping · /version                                   연결 확인
#   GET  /containers/json[?...]                              컨테이너 목록 · 상태 · health (환경변수는 담기지 않는다)
#   POST /containers/<허용목록>/restart[?t=..]               재시작 (멈춘 컨테이너도 다시 띄운다)
#
# 허용목록 = moa-a-backend-1 · moa-b-backend-1 · moa-a-frontend-1 · moa-b-frontend-1
#   이름으로 경로를 막으므로 db · gateway · interpreter · healing 자신은 재시작할 수 없다
#   inspect(/containers/<이름>/json)도 막는다 — 응답에 환경변수(비밀값)가 들어 있다
#   생성 · 삭제 · 중지 · exec · 이미지 · 볼륨 · 네트워크 API 는 모두 막는다

global
    log stdout format raw local0 info
    maxconn 100

defaults
    mode http
    log global
    option httplog
    timeout connect 3s
    timeout client 60s
    timeout server 60s       # restart 는 컨테이너 정지 대기(t)만큼 걸린다

frontend docker_api
    bind :2375

    acl m_read  method GET HEAD
    acl m_post  method POST
    acl p_ping    path_reg ^(/v[0-9.]+)?/(_ping|version)$
    acl p_list    path_reg ^(/v[0-9.]+)?/containers/json$
    acl p_restart path_reg ^(/v[0-9.]+)?/containers/moa-(a|b)-(backend|frontend)-1/restart$
    acl p_backend_stop path_reg ^(/v[0-9.]+)?/containers/moa-(a|b)-backend-1/stop$

    http-request allow if m_read p_ping
    http-request allow if m_read p_list
    http-request allow if m_post p_restart
    http-request allow if m_post p_backend_stop
    http-request deny deny_status 403

    default_backend docker_sock

backend docker_sock
    server sock /var/run/docker.sock
