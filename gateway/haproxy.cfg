# 게이트웨이 (공용 스택 gateway) — PRD 5.4 · 기획서 6절 배포 구성
#
# 사용자 요청: :8501 → 앱 스택 A · B 의 frontend (round-robin + 쿠키 고정)
# 상태 판정 : 같은 스택 backend 의 /health 를 2초 간격, 2회 실패면 제외 · 2회 연속 성공이면 재등록
# 상태 조회 : :8404/stats (;csv) — moa_core 안에서만. healing 이 "다른 복제본이 UP 인가"를 읽는다
#
# 대상은 서비스 이름이 아니라 컨테이너 이름으로 지정한다 — 게이트웨이는 두 앱 네트워크에 모두 붙어 있어
# "frontend" · "backend" 라는 이름이 A · B 둘 다를 가리킨다

global
    log stdout format raw local0 info
    maxconn 2000
    # 관리 명령(배포 중 스택 빼기 · 다시 넣기) — 컨테이너 안 127.0.0.1 에서만. scripts/deploy.sh 가 쓴다
    stats socket ipv4@127.0.0.1:9999 level admin

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 1s         # 같은 호스트 안 연결이라 1초면 충분 — 멈춘 컨테이너로 간 요청을 빨리 다른 스택으로
    timeout client 60s
    timeout server 60s
    timeout http-request 10s
    timeout tunnel 1h          # Streamlit WebSocket — 화면을 열어 둔 동안 끊지 않는다
    timeout check 3s           # /health 는 해석 서비스 핑(0.8초 × 2)까지 하므로 넉넉히
    # 고정된 스택에 연결이 안 되면 다른 스택으로 다시 보낸다 (쿠키 고정보다 우선)
    option redispatch 1        # 재시도할 때마다 다른 스택으로
    retries 2

# Docker 내장 DNS. 컨테이너가 멈추면 이름이 사라진다 → 해당 서버는 곧바로 MAINT(트래픽 제외)
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 2
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s
    hold nx 2s
    hold other 2s
    hold refused 2s
    hold timeout 2s
    hold obsolete 2s

frontend web
    bind :8501
    default_backend app

# 사용자 트래픽 — 서버 상태는 아래 chk_* 의 backend 점검을 따라간다(track)
backend app
    balance roundrobin
    cookie MOA_STACK insert indirect nocache httponly
    # init-addr libc,none: 시작 · 설정 다시 읽기 때 바로 주소를 잡고(없으면 none), 앱 스택이 아직 없어도 게이트웨이가 먼저 뜬다
    default-server resolvers docker init-addr libc,none on-marked-down shutdown-sessions
    server a moa-a-frontend-1:8501 cookie a track chk_a/backend
    server b moa-b-frontend-1:8501 cookie b track chk_b/backend

# 상태 점검 전용 — 각 스택 backend /health (트래픽은 보내지 않는다)
backend chk_a
    option httpchk GET /ready
    http-check expect status 200
    server backend moa-a-backend-1:8000 check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none

backend chk_b
    option httpchk GET /ready
    http-check expect status 200
    server backend moa-b-backend-1:8000 check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none

# 상태 페이지 — 밖으로 열지 않는다 (compose 에서 publish 하지 않음)
listen stats
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    http-request set-log-level silent   # healing 이 자주 읽는다 — 로그에 남기지 않는다
